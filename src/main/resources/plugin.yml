name: YinwuTax
main: org.kirov.plugins.yinwutax.YinwuTaxPlugin
version: ${project.version}
description: 适用于 Bukkit/Paper/Folia 的税务插件，支持所得税、人头税与财产税。
api-version: "1.21"
folia-supported: true
authors: [kirov]
website: https://github.com/YinwuRealm/YinwuTax
softdepend: [Vault, VaultUnlocked, PlaceholderAPI, iConomyUnlocked]

commands:
  yinwutax:
    description: 查看税务状态并执行管理命令。
    usage: /yinwutax [status|reload|exempt|headcount|settle]
    aliases: [ytax]

permissions:
  yinwutax.admin:
    description: 拥有 YinwuTax 全部管理权限。
    default: op
  yinwutax.command.reload:
    description: 重载 YinwuTax 配置。
    default: op
  yinwutax.command.status:
    description: 查看玩家税务状态。
    default: op
  yinwutax.command.exempt:
    description: 管理玩家免税次数。
    default: op
  yinwutax.command.headcount:
    description: 管理人头税额外账户覆盖值。
    default: op
  yinwutax.command.settle:
    description: 手动触发税务结算。
    default: op
